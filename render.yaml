# Render Blueprint — https://render.com
# 1) New → Blueprint → connect this repo
# 2) Set GEMINI_API_KEY in the dashboard (Environment)
services:
  - type: web
    name: wisef-rag-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      # Do not block boot on scrape — corpus is in the image
      - key: FORCE_SCRAPE_ON_BOOT
        value: "0"
      - key: REINGEST_INTERVAL_HOURS
        value: "0"
      - key: REINGEST_MODE
        value: "off"
      # Site is served behind Render's proxy — use real client IP for rate limiting
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ADMIN_TOKEN
        sync: false
      # SMTP — contact form emails go to info@wisef.am.
      # Fill in SMTP_HOST/SMTP_USER/SMTP_PASSWORD in the dashboard.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CONTACT_TO_EMAIL
        value: info@wisef.am
      # Only needed if this API is paired with a separately hosted site.
      - key: WISEF_PAGES_ORIGIN
        sync: false
