name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest & Grounding Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: |
          python -m pytest backend/tests -v

  frontend-build:
    name: Frontend Eleventy Build & Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static site
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f _site/index.html || (echo "Missing _site/index.html" && exit 1)
          test -f _site/robots.txt || (echo "Missing _site/robots.txt" && exit 1)
          test -f _site/sitemap.xml || (echo "Missing _site/sitemap.xml" && exit 1)
          test -f _site/_headers || (echo "Missing _site/_headers" && exit 1)
          test -f _site/.well-known/security.txt || (echo "Missing _site/.well-known/security.txt" && exit 1)
          echo "All static and security build artifacts verified successfully!"
